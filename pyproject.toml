[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-hdb-resale-analytics"
version = "1.1.0"
description = "Reproducible analytics for Singapore HDB resale transactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "plotly==7.0.0",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "streamlit==1.63.0",
]

[project.optional-dependencies]
notebook = ["jupyter==1.1.1"]
dev = ["jupyter==1.1.1", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401"]
"src/advanced_analysis.py" = ["E402", "I001"]
